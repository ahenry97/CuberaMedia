name: Local testing backup

on:
  push:
    branches:
      - develop
      - "feature/**"
      - "codex/**"
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  validate-local-testing:
    name: Validate local testing structure
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate expected project directories
        run: |
          test -d website
          test -d environments/local
          test -d migrations

      - name: Upload website snapshot
        uses: actions/upload-artifact@v4
        with:
          name: website-snapshot-${{ github.sha }}
          path: website
          retention-days: 30
